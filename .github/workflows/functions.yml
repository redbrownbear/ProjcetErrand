# 서버 함수 · Firestore 보안 규칙 테스트 (Firestore 에뮬레이터)
# 설계: docs/1차_백엔드_설계.md — W2 규칙 검증, W3 거래 흐름 검증
name: functions

on:
  pull_request:
    paths: ['functions/**', 'firebase/**', 'firebase.json', '.github/workflows/functions.yml']
  push:
    branches: [main]
    paths: ['functions/**', 'firebase/**', 'firebase.json', '.github/workflows/functions.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('functions/package-lock.json') }}
      - run: npm ci
      - run: npm run build
      - run: npm test
