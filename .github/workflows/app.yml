# 앱 정적 분석 · 테스트
name: app

on:
  pull_request:
    paths: ['lib/**', 'test/**', 'pubspec.yaml', 'pubspec.lock', 'analysis_options.yaml', '.github/workflows/app.yml']
  push:
    branches: [main]
    paths: ['lib/**', 'test/**', 'pubspec.yaml', 'pubspec.lock', 'analysis_options.yaml', '.github/workflows/app.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      # pubspec.lock이 커밋본과 다르면(새 패키지 · any 버전) 고른 버전을 주석으로 남긴다 — 그 버전으로 pubspec을 고정한다
      - name: pubspec.lock 변경 알림
        run: |
          git diff --quiet pubspec.lock && exit 0
          python3 - <<'PY'
          import re, subprocess
          diff = subprocess.run(['git', 'diff', '-U0', 'pubspec.lock'], capture_output=True, text=True).stdout
          lock = open('pubspec.lock', encoding='utf-8').read()
          for name, ver in re.findall(r'^  ([a-z0-9_]+):\n(?:    .*\n)*?    version: "([^"]+)"', lock, re.M):
              if re.search(r'^\+.*' + re.escape(ver), diff, re.M) and name in diff:
                  print(f'::notice title=pubspec.lock::{name} {ver}')
          PY
      # 오류·경고를 주석(annotation)으로도 남긴다 — 로그를 못 여는 곳에서도 어디가 틀렸는지 보이게
      - name: flutter analyze
        run: |
          set +e
          dart analyze --format=machine > analyze.txt 2>&1
          code=$?
          awk -F'|' '$1=="ERROR"||$1=="WARNING" { gsub(/^.*\/lib\//,"lib/",$4); gsub(/^.*\/test\//,"test/",$4); printf "::error file=%s,line=%s,col=%s::%s %s\n",$4,$5,$6,$3,$8 }' analyze.txt
          cat analyze.txt
          exit $code
      # 실패한 테스트 이름·오류를 주석으로 남긴다(로그를 못 여는 곳에서도 보이게)
      - name: flutter test
        run: |
          set +e
          flutter test --reporter json > test.jsonl
          code=$?
          python3 - <<'PY'
          import json
          names, errs = {}, {}
          for line in open('test.jsonl', encoding='utf-8'):
              line = line.strip()
              if not line.startswith('{'):
                  continue
              e = json.loads(line)
              t = e.get('type')
              if t == 'testStart':
                  names[e['test']['id']] = (e['test']['name'], e['test'].get('url') or '')
              elif t == 'error':
                  errs.setdefault(e['testID'], []).append(e.get('error', ''))
              elif t == 'print' and 'EXCEPTION' in e.get('message', ''):
                  m = e['message'].splitlines()
                  keep = [l for l in m if l.strip() and not l.startswith('══') and not l.startswith('When the exception')][:8]
                  errs.setdefault(e['testID'], []).insert(0, ' / '.join(keep))
              elif t == 'testDone' and e.get('result') != 'success' and not e.get('hidden'):
                  name, url = names.get(e['testID'], ('?', ''))
                  msg = ' | '.join(errs.get(e['testID'], []))[:1500].replace('\n', ' ').replace('%', '%25')
                  print(f"::error title=test failed::{name} — {msg}")
          PY
          exit $code
